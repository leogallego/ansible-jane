name: Baseline Profiles

# Generate Baseline + Startup profiles on demand or weekly (#214).
# Not part of PR CI — managed devices are slow/flaky; merge artifacts after review.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: baseline-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate baseline profiles
    # Pinned to ubuntu-24.04: the emulator+managed-device stack broke on the
    # 26.04 image (runner-images#14748 migration). Revisit before GitHub
    # retires 24.04 (22.04 precedent: unsupported April 2027).
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      # Pin the AVD/emulator home to ~/.android so avdmanager and the emulator
      # agree on one location. Without this, avdmanager writes device config to
      # ~/.config/.android while the emulator looks in ~/.android, and device
      # profiles fail to load (devices.xml) — see actions/runner-images#11482.
      ANDROID_USER_HOME: /home/runner/.android
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_EMULATOR_HOME: /home/runner/.android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          # temurin over jetbrains: the JBR catalog intermittently has no
          # match for "25" (No matching version found for SemVer '25').
          distribution: temurin
          java-version: "25"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-baseline-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-baseline-
            ${{ runner.os }}-gradle-

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle Managed Device
        run: |
          ./gradlew --no-daemon :baselineprofile:pixel6Api34Setup \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Generate release baseline + startup profiles
        run: |
          ./gradlew --no-daemon :app:generateReleaseBaselineProfile \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true

      - name: Upload generated profiles
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profiles
          path: |
            app/src/**/generated/baselineProfiles/**
            app/build/outputs/**
          if-no-files-found: warn
